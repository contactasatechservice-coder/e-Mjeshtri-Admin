name: Build e-Mjeshtri Admin Web

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admin-web.yml"
      - ".github/e_mjeshtri_admin_patch/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e-mjeshtri-admin-web
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare Flutter source
        run: |
          rm -rf /tmp/e_mjeshtri_admin
          mkdir -p /tmp/e_mjeshtri_admin/app
          base64 --decode .github/e_mjeshtri_admin_web/source_base64.txt > /tmp/e_mjeshtri_admin/source.zip
          unzip -q /tmp/e_mjeshtri_admin/source.zip -d /tmp/e_mjeshtri_admin/source
          cp -a /tmp/e_mjeshtri_admin/source/e_mjeshtri_admin_flutter_web/. /tmp/e_mjeshtri_admin/app/

          if [ -f .github/e_mjeshtri_admin_patch/admin_patch.zip ]; then
            cp .github/e_mjeshtri_admin_patch/admin_patch.zip /tmp/e_mjeshtri_admin/patch.zip
          else
            cp .github/e_mjeshtri_admin_patch/patch_base64.txt /tmp/e_mjeshtri_admin/patch.b64
            base64 --decode /tmp/e_mjeshtri_admin/patch.b64 > /tmp/e_mjeshtri_admin/patch.zip
          fi
          unzip -qo /tmp/e_mjeshtri_admin/patch.zip -d /tmp/e_mjeshtri_admin/app

          test -f /tmp/e_mjeshtri_admin/app/pubspec.yaml
          test -f /tmp/e_mjeshtri_admin/app/lib/main.dart
          test -f /tmp/e_mjeshtri_admin/app/lib/screens/module_screens.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web project
        run: |
          cd /tmp/e_mjeshtri_admin/app
          flutter config --enable-web --no-analytics
          flutter create . --platforms=web --project-name e_mjeshtri_admin
          rm -rf test

      - name: Install dependencies
        run: |
          cd /tmp/e_mjeshtri_admin/app
          flutter pub get

      - name: Analyze
        run: |
          cd /tmp/e_mjeshtri_admin/app
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web
        run: |
          cd /tmp/e_mjeshtri_admin/app
          flutter build web --release

      - name: Publish static build into main
        run: |
          rm -rf /tmp/site
          mkdir -p /tmp/site
          cp -a /tmp/e_mjeshtri_admin/app/build/web/. /tmp/site/
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            -exec rm -rf {} +
          cp -a /tmp/site/. .
          cat > vercel.json <<'JSON'
          {
            "cleanUrls": true,
            "rewrites": [
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No build changes to publish"
          else
            git commit -m "Publish e-Mjeshtri Admin functional modules [skip ci]"
            git push origin main
          fi
