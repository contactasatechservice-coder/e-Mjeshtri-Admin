name: Build e-Mjeshtri Admin Web

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admin-web.yml"
      - ".github/e_mjeshtri_admin_overlay/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e-mjeshtri-admin-web
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare Flutter source
        run: |
          rm -rf /tmp/e_mjeshtri_admin
          mkdir -p /tmp/e_mjeshtri_admin/app

          # Base Flutter source.
          base64 --decode .github/e_mjeshtri_admin_web/source_base64.txt > /tmp/e_mjeshtri_admin/source.zip
          unzip -q /tmp/e_mjeshtri_admin/source.zip -d /tmp/e_mjeshtri_admin/source
          cp -a /tmp/e_mjeshtri_admin/source/e_mjeshtri_admin_flutter_web/. /tmp/e_mjeshtri_admin/app/

          # Last known-good Supabase V2 patch (login, dashboard, citizens, providers).
          base64 --decode .github/e_mjeshtri_admin_patch/patch_base64.txt > /tmp/e_mjeshtri_admin/base_patch.zip
          unzip -t /tmp/e_mjeshtri_admin/base_patch.zip
          unzip -qo /tmp/e_mjeshtri_admin/base_patch.zip -d /tmp/e_mjeshtri_admin/app

          # Human-readable source overlay for all remaining admin modules.
          cp -a .github/e_mjeshtri_admin_overlay/. /tmp/e_mjeshtri_admin/app/

          test -f /tmp/e_mjeshtri_admin/app/pubspec.yaml
          test -f /tmp/e_mjeshtri_admin/app/lib/main.dart
          test -f /tmp/e_mjeshtri_admin/app/lib/screens/admin_module_screen.dart
          test -f /tmp/e_mjeshtri_admin/app/lib/data/admin_modules_repository.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web project
        run: |
          cd /tmp/e_mjeshtri_admin/app
          flutter config --enable-web --no-analytics
          flutter create . --platforms=web --project-name e_mjeshtri_admin
          rm -rf test

      - name: Install dependencies
        run: |
          cd /tmp/e_mjeshtri_admin/app
          flutter pub get

      - name: Analyze
        run: |
          cd /tmp/e_mjeshtri_admin/app
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Flutter Web
        run: |
          cd /tmp/e_mjeshtri_admin/app
          flutter build web --release

      - name: Publish static build into main
        run: |
          set -euo pipefail
          rm -rf /tmp/site
          mkdir -p /tmp/site
          cp -a /tmp/e_mjeshtri_admin/app/build/web/. /tmp/site/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish on top of the newest main without rebasing generated files.
          git fetch origin main
          git reset --hard origin/main

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            -exec rm -rf {} +
          cp -a /tmp/site/. .
          cat > vercel.json <<'JSON'
          {
            "cleanUrls": true,
            "rewrites": [
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          JSON

          git add -A
          if git diff --cached --quiet; then
            echo "No build changes to publish"
          else
            git commit -m "Publish fully functional e-Mjeshtri Admin [skip ci]"
            git push origin HEAD:main
          fi
