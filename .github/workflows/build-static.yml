name: Build and publish e-Mjeshtri Admin Web

on:
  push:
    branches: [ main ]
    paths:
      - '.source/**'
      - '.github/workflows/build-static.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e-mjeshtri-admin-static
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter source
        run: |
          mkdir -p /tmp/em_admin
          base64 --decode .source/source_base64.txt > /tmp/em_admin/source.zip
          unzip -q /tmp/em_admin/source.zip -d /tmp/em_admin
          cp -a /tmp/em_admin/e_mjeshtri_admin_flutter_web/. /tmp/em_admin/app
          cd /tmp/em_admin/app
          flutter config --enable-web --no-analytics
          flutter create . --platforms=web --project-name e_mjeshtri_admin
          rm -rf test
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
          flutter build web --release

      - name: Publish static web files to main
        run: |
          mkdir -p /tmp/em_site
          cp -a /tmp/em_admin/app/build/web/. /tmp/em_site/
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.source' -exec rm -rf {} +
          cp -a /tmp/em_site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish e-Mjeshtri Admin Web V2 [skip ci]"
          git push origin HEAD:main
