name: Build e-Mjeshtri Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/e_mjeshtri_mobile_src.b64'
      - '.github/workflows/build-emjeshtri-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Reconstruct Unified mobile source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/e_mjeshtri
          mkdir -p .build/e_mjeshtri
          base64 -d .github/e_mjeshtri_mobile_src.b64 > /tmp/e_mjeshtri_unified.tar.gz
          tar -xzf /tmp/e_mjeshtri_unified.tar.gz -C .build/e_mjeshtri
          rm -f .build/e_mjeshtri/pubspec.lock
          sed -i -E 's/^version:.*/version: 1.2.1+13/' .build/e_mjeshtri/pubspec.yaml
          if [ -f .build/e_mjeshtri/lib/core/config/app_config.dart ]; then
            sed -i -E "s/static const currentVersion = '[^']+';/static const currentVersion = '1.2.1';/" .build/e_mjeshtri/lib/core/config/app_config.dart
          fi
          cd .build/e_mjeshtri
          flutter create --platforms=android --org io.emjeshtri --project-name e_mjeshtri .
          rm -rf test

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'''
          s = s.replace(marker, permissions, 1)
          s = s.replace('android:label="e_mjeshtri"', 'android:label="e-Mjeshtri"')
          deep_link = '''            <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="io.emjeshtri.app" android:host="login-callback"/>
              </intent-filter>
          '''
          if 'android:scheme="io.emjeshtri.app"' not in s:
              s = s.replace('</activity>', deep_link + '</activity>', 1)
          manifest.write_text(s)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          gradle.write_text(g)
          PY

          flutter pub get

      - name: Verify Unified source
        shell: bash
        run: |
          set -euo pipefail
          test -f .build/e_mjeshtri/lib/features/auth/role_selection_screen.dart
          test -f .build/e_mjeshtri/lib/features/provider_portal/provider_gate.dart
          test -f .build/e_mjeshtri/lib/features/provider_portal/shell.dart
          test -f .build/e_mjeshtri/lib/features/subscriptions/subscription_screen.dart
          grep -q "GoRoute(path:'/provider'" .build/e_mjeshtri/lib/app.dart
          grep -q "Qytetar" .build/e_mjeshtri/lib/features/auth/role_selection_screen.dart
          grep -q "Mjeshtër" .build/e_mjeshtri/lib/features/auth/role_selection_screen.dart
          grep -q "provider_subscription_quote" .build/e_mjeshtri/lib/features/subscriptions/subscription_screen.dart
          grep -q "provider_request_subscription" .build/e_mjeshtri/lib/features/subscriptions/subscription_screen.dart
          grep -q "Tick blu" .build/e_mjeshtri/lib/features/subscriptions/subscription_screen.dart
          grep -q "version: 1.2.1+13" .build/e_mjeshtri/pubspec.yaml

      - name: Analyze
        working-directory: .build/e_mjeshtri
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Generate launcher icon
        working-directory: .build/e_mjeshtri
        run: |
          if [ -f flutter_launcher_icons_android.yaml ]; then
            dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
          fi

      - name: Build release APK
        working-directory: .build/e_mjeshtri
        run: flutter build apk --release

      - name: Prepare artifact
        shell: bash
        run: |
          cp .build/e_mjeshtri/build/app/outputs/flutter-apk/app-release.apk e-Mjeshtri-Unified-v1.2.1.apk
          sha256sum e-Mjeshtri-Unified-v1.2.1.apk > e-Mjeshtri-Unified-v1.2.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: e-Mjeshtri-Unified-v1.2.1-Android
          path: |
            e-Mjeshtri-Unified-v1.2.1.apk
            e-Mjeshtri-Unified-v1.2.1.apk.sha256
          if-no-files-found: error
          retention-days: 30
