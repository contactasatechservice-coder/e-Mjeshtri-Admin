name: Build e-Mjeshtri Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/e_mjeshtri_mobile_src/**'
      - '.github/workflows/build-emjeshtri-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          rm -rf .build/e_mjeshtri
          mkdir -p .build/e_mjeshtri
          cd .build/e_mjeshtri
          flutter create --platforms=android --org io.emjeshtri --project-name e_mjeshtri .
          rm -rf test
          cp -a ../../.github/e_mjeshtri_mobile_src/. .
          mkdir -p assets/branding
          base64 -d logo_base64.txt > assets/branding/e_mjeshtri_logo.png
          rm -f logo_base64.txt
          sed -i 's/android:label="e_mjeshtri"/android:label="e-Mjeshtri"/' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Analyze
        working-directory: .build/e_mjeshtri
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Generate launcher icon
        working-directory: .build/e_mjeshtri
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build release APK
        working-directory: .build/e_mjeshtri
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          cp .build/e_mjeshtri/build/app/outputs/flutter-apk/app-release.apk e-Mjeshtri-release.apk
          sha256sum e-Mjeshtri-release.apk > e-Mjeshtri-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: e-Mjeshtri-Android-release
          path: |
            e-Mjeshtri-release.apk
            e-Mjeshtri-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
