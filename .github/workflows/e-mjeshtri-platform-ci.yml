name: e-Mjeshtri Platform CI
on:
  push:
    branches: [development/e-mjeshtri-2]
    paths:
      - 'platform/**'
      - '.github/workflows/e-mjeshtri-platform-ci.yml'
  pull_request:
    paths:
      - 'platform/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
