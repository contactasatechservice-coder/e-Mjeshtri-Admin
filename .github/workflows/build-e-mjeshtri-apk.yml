name: Build e-Mjeshtri Unified APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/e_mjeshtri_mobile_src.b64'
      - '.github/e_mjeshtri_role_selection_v1_4.dart'
      - '.github/e_mjeshtri_login_v1_4.dart'
      - '.github/e_mjeshtri_register_v1_4.dart'
      - '.github/e_mjeshtri_verify_v1_4.dart'
      - 'assets/assets/branding/e_mjeshtri_logo.png'
      - '.github/workflows/build-e-mjeshtri-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Reconstruct unified mobile source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/e_mjeshtri
          mkdir -p .build/e_mjeshtri
          base64 -d .github/e_mjeshtri_mobile_src.b64 > /tmp/e_mjeshtri_unified_v1_3_0.tar.gz
          tar -xzf /tmp/e_mjeshtri_unified_v1_3_0.tar.gz -C .build/e_mjeshtri
          cd .build/e_mjeshtri
          flutter create --platforms=android --org io.emjeshtri --project-name e_mjeshtri .
          rm -rf test
          cp ../../.github/e_mjeshtri_role_selection_v1_4.dart lib/features/auth/role_selection_screen.dart
          cp ../../.github/e_mjeshtri_login_v1_4.dart lib/features/auth/login_screen.dart
          cp ../../.github/e_mjeshtri_register_v1_4.dart lib/features/auth/register_screen.dart
          cp ../../.github/e_mjeshtri_verify_v1_4.dart lib/features/auth/signup_verification_screen.dart
          cp ../../assets/assets/branding/e_mjeshtri_logo.png assets/branding/e_mjeshtri_logo.png

          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'''
          s=s.replace(marker,permissions,1)
          s=s.replace('android:label="e_mjeshtri"','android:label="e-Mjeshtri"')
          deep_link='''            <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="io.emjeshtri.app" android:host="login-callback"/>
              </intent-filter>
          '''
          if 'android:scheme="io.emjeshtri.app"' not in s:
              s=s.replace('</activity>',deep_link+'</activity>',1)
          manifest.write_text(s)

          gradle=Path('android/app/build.gradle.kts')
          g=gradle.read_text()
          g=g.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
          g=g.replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          gradle.write_text(g)

          pubspec=Path('pubspec.yaml')
          p=pubspec.read_text()
          p=p.replace('version: 1.3.0+20','version: 1.4.1+22')
          pubspec.write_text(p)

          config=Path('lib/core/config/app_config.dart')
          a=config.read_text().replace("currentVersion = '1.3.0'", "currentVersion = '1.4.1'")
          config.write_text(a)

          splash=Path('lib/features/auth/splash_screen.dart')
          ss=splash.read_text()
          ss=ss.replace("context.go(session == null ? '/auth' : '/home');", "context.go('/role');")
          splash.write_text(ss)

          strings=Path('lib/core/localization/app_strings.dart')
          if strings.exists():
              t=strings.read_text()
              t=t.replace('Version 1.3.0', 'Version 1.4.1')
              t=t.replace('Versione 1.3.0', 'Versione 1.4.1')
              strings.write_text(t)
          PY

          flutter pub get

      - name: Verify correct unified source
        shell: bash
        run: |
          set -euo pipefail
          APP=.build/e_mjeshtri
          test -f "$APP/lib/features/auth/role_selection_screen.dart"
          test -f "$APP/lib/features/provider_portal/provider_gate.dart"
          test -f "$APP/lib/features/provider_portal/shell.dart"
          test -f "$APP/lib/features/subscriptions/subscription_screen.dart"
          test -f "$APP/lib/core/utils/blue_tick.dart"
          grep -q "GoRoute(path:'/provider'" "$APP/lib/app.dart"
          grep -q "Qytetar" "$APP/lib/features/auth/role_selection_screen.dart"
          grep -q "Mjeshtër" "$APP/lib/features/auth/role_selection_screen.dart"
          grep -q "Si do ta përdorësh e-Mjeshtri?" "$APP/lib/features/auth/role_selection_screen.dart"
          grep -q "Zgjidh rolin tënd" "$APP/lib/features/auth/role_selection_screen.dart"
          grep -q "context.go('/role')" "$APP/lib/features/auth/splash_screen.dart"
          grep -q "role=='provider'?'/provider':'/permissions/location'" "$APP/lib/features/auth/login_screen.dart"
          grep -q "provider_subscription_quote" "$APP/lib/features/subscriptions/subscription_screen.dart"
          grep -q "provider_request_subscription" "$APP/lib/features/subscriptions/subscription_screen.dart"
          grep -q "+500 Lek" "$APP/lib/features/subscriptions/subscription_screen.dart"
          grep -q "blue_tick_expires_at" "$APP/lib/core/utils/blue_tick.dart"
          grep -q "version: 1.4.1+22" "$APP/pubspec.yaml"
          grep -q "currentVersion = '1.4.1'" "$APP/lib/core/config/app_config.dart"
          grep -q "themeMode:ThemeMode.light" "$APP/lib/app.dart"
          echo "0c97874d718d302e10568373defa1ee085a225757846bcfd23417a2b232365e3  $APP/assets/branding/e_mjeshtri_logo.png" | sha256sum -c -
          echo "UNIFIED SOURCE VERIFIED: approved role-first UI + citizen + provider + subscriptions + blue tick + accepted logo + light theme"

      - name: Analyze
        working-directory: .build/e_mjeshtri
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Generate launcher icon
        working-directory: .build/e_mjeshtri
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build release APK
        working-directory: .build/e_mjeshtri
        run: flutter build apk --release

      - name: Prepare artifact
        shell: bash
        run: |
          cp .build/e_mjeshtri/build/app/outputs/flutter-apk/app-release.apk e-Mjeshtri-Unified-v1.4.1.apk
          sha256sum e-Mjeshtri-Unified-v1.4.1.apk > e-Mjeshtri-Unified-v1.4.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: e-Mjeshtri-Unified-v1.4.1-Android
          path: |
            e-Mjeshtri-Unified-v1.4.1.apk
            e-Mjeshtri-Unified-v1.4.1.apk.sha256
          if-no-files-found: error
          retention-days: 30
