name: Build e-Mjeshtri Unified APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/e_mjeshtri_mobile_src.b64'
      - '.github/e_mjeshtri_role_selection_v1_4.dart'
      - '.github/e_mjeshtri_login_v1_4.dart'
      - '.github/e_mjeshtri_register_v1_4.dart'
      - '.github/e_mjeshtri_verify_v1_4.dart'
      - '.github/e_mjeshtri_splash_v1_4_3.dart'
      - '.github/e_mjeshtri_mobile_src/lib/features/marketplace/marketplace_repository.dart'
      - '.github/e_mjeshtri_mobile_src/lib/features/onboarding/onboarding_screen.dart'
      - '.github/e_mjeshtri_mobile_src/lib/features/requests/request_flow.dart'
      - '.github/e_mjeshtri_mobile_src/lib/features/auth/auth_repository.dart'
      - 'assets/assets/branding/e_mjeshtri_logo.png'
      - '.github/workflows/build-e-mjeshtri-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Reconstruct unified mobile source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/e_mjeshtri
          mkdir -p .build/e_mjeshtri
          base64 -d .github/e_mjeshtri_mobile_src.b64 > /tmp/e_mjeshtri_unified_v1_3_0.tar.gz
          tar -xzf /tmp/e_mjeshtri_unified_v1_3_0.tar.gz -C .build/e_mjeshtri
          cd .build/e_mjeshtri
          flutter create --platforms=android --org io.emjeshtri --project-name e_mjeshtri .
          rm -rf test
          cp ../../.github/e_mjeshtri_role_selection_v1_4.dart lib/features/auth/role_selection_screen.dart
          cp ../../.github/e_mjeshtri_login_v1_4.dart lib/features/auth/login_screen.dart
          cp ../../.github/e_mjeshtri_register_v1_4.dart lib/features/auth/register_screen.dart
          cp ../../.github/e_mjeshtri_verify_v1_4.dart lib/features/auth/signup_verification_screen.dart
          cp ../../.github/e_mjeshtri_splash_v1_4_3.dart lib/features/auth/splash_screen.dart
          cp ../../.github/e_mjeshtri_mobile_src/lib/features/requests/request_flow.dart lib/features/requests/request_flow.dart
          cp ../../.github/e_mjeshtri_mobile_src/lib/features/onboarding/onboarding_screen.dart lib/features/onboarding/onboarding_screen.dart
          cp ../../.github/e_mjeshtri_mobile_src/lib/features/marketplace/marketplace_repository.dart lib/features/marketplace/marketplace_repository.dart
          cp ../../.github/e_mjeshtri_mobile_src/lib/features/auth/auth_repository.dart lib/features/auth/auth_repository.dart
          cp ../../assets/assets/branding/e_mjeshtri_logo.png assets/branding/e_mjeshtri_logo.png

          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'''
          s=s.replace(marker,permissions,1)
          s=s.replace('android:label="e_mjeshtri"','android:label="e-Mjeshtri"')
          deep_link='''            <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="io.emjeshtri.app" android:host="login-callback"/>
              </intent-filter>
          '''
          if 'android:scheme="io.emjeshtri.app"' not in s:
              s=s.replace('</activity>',deep_link+'</activity>',1)
          manifest.write_text(s)

          gradle=Path('android/app/build.gradle.kts')
          g=gradle.read_text()
          g=g.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
          g=g.replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          gradle.write_text(g)

          pubspec=Path('pubspec.yaml')
          p=pubspec.read_text()
          p=p.replace('version: 1.0.0+1','version: 1.4.5+26')
          pubspec.write_text(p)

          config=Path('lib/core/config/app_config.dart')
          a=config.read_text().replace("currentVersion = '1.0.0'", "currentVersion = '1.4.5'")
          config.write_text(a)

          strings=Path('lib/core/localization/app_strings.dart')
          if strings.exists():
              t=strings.read_text()
              t=t.replace('Version 1.3.0', 'Version 1.4.5')
              t=t.replace('Versione 1.3.0', 'Versione 1.4.5')
              strings.write_text(t)

          # Remove in-app role switching and send every explicit sign-out back
          # to the first Qytetar/Mjeshtër choice screen.
          citizen_profile=Path('lib/features/profile/profile_screen.dart')
          cp=citizen_profile.read_text()
          cp=cp.replace("              _tile(Icons.swap_horiz_rounded, 'Ndrysho rol', () => context.go('/role')),\n", "")
          cp=cp.replace("if (context.mounted) context.go('/auth');", "if (context.mounted) context.go('/role');")
          citizen_profile.write_text(cp)

          provider_profile=Path('lib/features/provider_portal/profile.dart')
          pp=provider_profile.read_text()
          pp=pp.replace("    _Menu(icon:Icons.swap_horiz_rounded,title:'Ndrysho rol',onTap:()=>context.go('/role')),\n", "")
          pp=pp.replace("if(context.mounted)context.go('/auth');", "if(context.mounted)context.go('/role');")
          provider_profile.write_text(pp)

          settings=Path('lib/features/settings/settings_screens.dart')
          st=settings.read_text()
          st=st.replace("if (context.mounted) context.go('/auth');", "if (context.mounted) context.go('/role');")
          st=st.replace("if(context.mounted)context.go('/auth');", "if(context.mounted)context.go('/role');")
          settings.write_text(st)
          PY

          # Make the Android launcher logo smaller inside the icon safe area
          # so the full mark is clearer and no longer looks cropped.
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src=Image.open('assets/branding/e_mjeshtri_logo.png').convert('RGBA')

          def padded(ratio, background, dest):
              canvas=Image.new('RGBA',(1024,1024),background)
              size=int(1024*ratio)
              mark=src.resize((size,size),Image.Resampling.LANCZOS)
              offset=((1024-size)//2,(1024-size)//2)
              canvas.alpha_composite(mark,offset)
              canvas.save(dest)

          padded(0.82,(255,255,255,255),'assets/branding/e_mjeshtri_launcher.png')
          padded(0.72,(0,0,0,0),'assets/branding/e_mjeshtri_launcher_foreground.png')

          cfg=Path('flutter_launcher_icons_android.yaml')
          y=cfg.read_text()
          y=y.replace('image_path: "assets/branding/e_mjeshtri_logo.png"',
                      'image_path: "assets/branding/e_mjeshtri_launcher.png"')
          y=y.replace('adaptive_icon_foreground: "assets/branding/e_mjeshtri_logo.png"',
                      'adaptive_icon_foreground: "assets/branding/e_mjeshtri_launcher_foreground.png"')
          cfg.write_text(y)
          PY

          flutter pub get

      - name: Verify correct unified source
        shell: bash
        run: |
          set -euo pipefail
          APP=.build/e_mjeshtri
          for file in             "$APP/lib/features/auth/role_selection_screen.dart"             "$APP/lib/features/auth/login_screen.dart"             "$APP/lib/features/provider_portal/provider_gate.dart"             "$APP/lib/features/provider_portal/shell.dart"             "$APP/lib/features/subscriptions/subscription_screen.dart"             "$APP/pubspec.yaml"             "$APP/lib/core/config/app_config.dart"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          echo "Required e-Mjeshtri source files are present."
          grep -F "Qytetar" "$APP/lib/features/auth/role_selection_screen.dart" >/dev/null || echo "Warning: Qytetar marker not found"
          grep -F "Mjeshtër" "$APP/lib/features/auth/role_selection_screen.dart" >/dev/null || echo "Warning: Mjeshtër marker not found"
          grep -F "provider_subscription_quote" "$APP/lib/features/subscriptions/subscription_screen.dart" >/dev/null || echo "Warning: subscription quote marker not found"
          grep -F "provider_request_subscription" "$APP/lib/features/subscriptions/subscription_screen.dart" >/dev/null || echo "Warning: subscription request marker not found"
          if grep -Fq "Ndrysho rol" "$APP/lib/features/profile/profile_screen.dart" "$APP/lib/features/provider_portal/profile.dart"; then
            echo "Role-switch action still present"; exit 1
          fi
          grep -Fq "context.go('/role')" "$APP/lib/features/profile/profile_screen.dart"
          grep -Fq "context.go('/role')" "$APP/lib/features/provider_portal/profile.dart"
          grep -Fq "if (session == null)" "$APP/lib/features/auth/splash_screen.dart"
          grep -Fq "context.go('/role')" "$APP/lib/features/auth/splash_screen.dart"
          grep -Fq "context.go('/home')" "$APP/lib/features/requests/request_flow.dart"
          grep -Fq "reload();" "$APP/lib/features/requests/request_flow.dart"
          grep -Fq "context.go('/permissions/location')" "$APP/lib/features/onboarding/onboarding_screen.dart"
          grep -Fq "q.eq('is_verified', true)" "$APP/lib/features/marketplace/marketplace_repository.dart"
          grep -Fq "set_my_app_role" "$APP/lib/features/auth/login_screen.dart"
          grep -Fq "'app_role': role" "$APP/lib/features/auth/auth_repository.dart"
          grep -Fq "Timer.periodic" "$APP/lib/features/requests/request_flow.dart"
          test -f "$APP/assets/branding/e_mjeshtri_launcher.png"
          test -f "$APP/assets/branding/e_mjeshtri_launcher_foreground.png"
          grep -F "version:" "$APP/pubspec.yaml" | head -1
          grep -F "currentVersion" "$APP/lib/core/config/app_config.dart" | head -1
          echo "SOURCE CHECK COMPLETE — continuing to Flutter analyze/build."

      - name: Analyze
        working-directory: .build/e_mjeshtri
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Generate launcher icon
        working-directory: .build/e_mjeshtri
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Build release APK
        working-directory: .build/e_mjeshtri
        run: flutter build apk --release

      - name: Prepare artifact
        shell: bash
        run: |
          cp .build/e_mjeshtri/build/app/outputs/flutter-apk/app-release.apk e-Mjeshtri-Unified-v1.4.5.apk
          sha256sum e-Mjeshtri-Unified-v1.4.5.apk > e-Mjeshtri-Unified-v1.4.5.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: e-Mjeshtri-Unified-v1.4.5-Android
          path: |
            e-Mjeshtri-Unified-v1.4.5.apk
            e-Mjeshtri-Unified-v1.4.5.apk.sha256
          if-no-files-found: error
          retention-days: 30
